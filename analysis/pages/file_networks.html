<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Change Network Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        body { overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; }
        #main-view { flex: 1; position: relative; transition: margin-right 0.3s ease-in-out; }
        #main-view.sidebar-open { margin-right: 400px; }
        #network-svg { width: 100%; height: 100%; cursor: move; }

        #controls {
            position: absolute; top: 20px; left: 20px; z-index: 100; width: 320px;
            background: var(--paper); border: 1px solid var(--ink); padding: 0 18px 16px;
        }
        #controls .page-header { padding: 18px 0 12px; margin-bottom: 14px; }
        #controls .page-header h1 { font-size: 22px; }
        #controls .page-header p { font-size: 13px; }

        .control-group { margin-bottom: 14px; }
        .control-group label { display: block; color: var(--ink-2); font-size: 12px; margin-bottom: 5px; }
        .control-group select { width: 100%; }
        .control-group input[type=range] { width: calc(100% - 36px); vertical-align: middle; }
        #min-connections-value { font-family: var(--mono); font-size: 13px; margin-left: 6px; }

        .stats { border-top: 1px solid var(--hair); padding-top: 10px; margin-top: 4px; }
        .stats .stat-item { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; }
        .stats .stat-value { font-size: 15px; }

        #sidebar {
            width: 0; background: var(--paper); border-left: 1px solid var(--ink);
            overflow-y: auto; transition: width 0.3s ease-in-out; z-index: 200;
        }
        #sidebar.active { width: 400px; }
        #sidebar-content { padding: 24px 22px; min-height: 100vh; }
        #sidebar h2 { font-size: 20px; margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
        #sidebar h3 { margin: 22px 0 8px; }
        #sidebar .file-info { padding: 0 0 14px; border-bottom: 1px solid var(--hair); }
        #sidebar .file-path { font-family: var(--mono); font-size: 13px; word-break: break-all; margin-bottom: 10px; }
        #sidebar .file-category { display: inline-flex; align-items: center; font-size: 12px; color: var(--ink); margin-bottom: 8px; }
        #sidebar .file-commits { font-family: var(--mono); font-size: 13px; margin-top: 8px; }
        .conn-item { padding: 6px 0; border-bottom: 1px solid var(--hair-2); font-size: 12px; }
        .conn-item .muted, .commit-files { color: var(--ink-3); font-size: 11px; }
        .commit-item { padding: 8px 0 8px 12px; margin: 6px 0; border-left: 2px solid var(--ink); font-size: 13px; }
        .commit-hash { font-family: var(--mono); color: var(--ink-3); font-size: 11px; }
        .commit-date { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
        .commit-author { color: var(--ink); }
        .commit-subject { margin-top: 4px; line-height: 1.35; }
        #close-sidebar { position: absolute; top: 18px; right: 18px; font-size: 12px; }
        #sidebar:not(.active) #close-sidebar { display: none; }

        .node { cursor: pointer; stroke: var(--paper); stroke-width: 1.5px; }
        .node.selected { stroke: var(--ink); stroke-width: 2px; }
        .link { stroke: var(--ink); stroke-opacity: 0.12; }
        .link:hover, .link.highlighted { stroke: var(--c-1); stroke-opacity: 0.85; }
        .node-label { fill: var(--ink); font-size: 10px; text-anchor: middle; pointer-events: none; font-family: var(--font); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        .no-data { fill: var(--ink-3); }

        .legend {
            position: absolute; bottom: 20px; left: 20px; z-index: 100;
            background: var(--paper); border: 1px solid var(--ink); padding: 12px 16px;
        }
        .legend h3 { margin: 0 0 8px; }
        .legend-item { display: flex; align-items: center; margin: 4px 0; font-size: 12px; color: var(--ink); }
    </style>
</head>
<body>
    <div id="container">
        <div id="main-view">
            <div id="controls">
                <header class="page-header">
                    <h1>File Networks</h1>
                    <p>Which files change together in the same commits.</p>
                </header>
                
                <div class="control-group">
                    <label for="layout-select">Layout Algorithm:</label>
                    <select id="layout-select">
                        <option value="force">Force-directed</option>
                        <option value="circular">Circular</option>
                        <option value="hierarchical">Hierarchical</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="filter-category">Filter by Category:</label>
                    <select id="filter-category">
                        <option value="all">All Files</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="code-version-filter">Code Version:</label>
                    <select id="code-version-filter">
                        <option value="all">All Code</option>
                        <option value="code2.0">Code 2.0</option>
                        <option value="code3.0">Code 3.0</option>
                        <option value="personalities">Personalities</option>
                        <option value="other">Other Files</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="min-connections" title="Two files are linked when they changed in at least this many of the same commits. Files left with no link are hidden.">Min. shared commits:</label>
                    <input type="range" id="min-connections" min="2" max="18" value="2">
                    <span id="min-connections-value">2</span>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Files:</span>
                        <span class="stat-value" id="stat-files">0</span>
                        <span class="stat-label" id="stat-files-split"></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Connections:</span>
                        <span class="stat-value" id="stat-connections">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Total Commits:</span>
                        <span class="stat-value" id="stat-commits">0</span>
                    </div>
                </div>
            </div>
            
            <div class="legend">
                <h3>Files</h3>
                <div id="legend-items"></div>
            </div>
            
            <svg id="network-svg"></svg>
        </div>
        
        <div id="sidebar">
            <button id="close-sidebar">✕ Close</button>
            <div id="sidebar-content"></div>
        </div>
    </div>

    <script>
        let networkData = null;
        let filteredData = null;
        let svg, simulation, nodes, links, labels;
        let selectedNode = null;
        
        // Color scheme for file categories
        const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        const groups = [
            { key: 'p-files',  label: 'p-files (personalities/)', token: '--c-1', match: p => p.startsWith('personalities/') },
            { key: 'core',     label: 'core code (code3.0/)',     token: '--c-2', match: p => p.startsWith('code3.0/') },
            { key: 'lists',    label: 'lists (lists/)',           token: '--c-3', match: p => p.startsWith('lists/') },
            { key: 'legacy',   label: 'legacy code (code2.0/)',   token: '--c-4', match: p => p.startsWith('code2.0/') },
            { key: 'other',    label: 'other files',              token: '--c-other', match: () => true },
        ];
        const groupOf = node => groups.find(g => g.match(node.full_path || node.id));
        const nodeColor = node => css(groupOf(node).token);
        
        // Initialize visualization
        function initVisualization() {
            svg = d3.select('#network-svg');
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            svg.attr('width', width).attr('height', height);
            
            // Add zoom behavior
            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    svg.select('g').attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
            // Create main group
            const g = svg.append('g');
            
            // Create groups for links and nodes
            g.append('g').attr('class', 'links');
            g.append('g').attr('class', 'nodes');
            g.append('g').attr('class', 'labels');
        }
        
        // Filter data based on current settings
        function filterData() {
            if (!networkData) {
                console.log('No network data available');
                return;
            }
            
            const categoryFilter = document.getElementById('filter-category').value;
            const codeVersionFilter = document.getElementById('code-version-filter').value;
            const minConnections = parseInt(document.getElementById('min-connections').value);
            
            console.log('=== FILTER DATA START ===');
            console.log('Original data:', networkData.nodes.length, 'nodes,', networkData.edges.length, 'edges');
            console.log('Filtering with category:', categoryFilter, 'codeVersion:', codeVersionFilter, 'minConnections:', minConnections);
            
            // Create deep copies to avoid modifying original data
            let filteredNodes = networkData.nodes.slice();
            
            // Apply category filter
            if (categoryFilter !== 'all') {
                filteredNodes = filteredNodes.filter(node => node.category === categoryFilter);
                console.log('After category filter:', filteredNodes.length, 'nodes');
            }
            
            // Apply code version filter
            if (codeVersionFilter !== 'all') {
                filteredNodes = filteredNodes.filter(node => {
                    const path = node.full_path;
                    switch (codeVersionFilter) {
                        case 'code2.0':
                            return path.startsWith('code2.0/');
                        case 'code3.0':
                            return path.startsWith('code3.0/');
                        case 'personalities':
                            return path.startsWith('personalities/');
                        case 'other':
                            return !path.startsWith('code2.0/') && 
                                   !path.startsWith('code3.0/') && 
                                   !path.startsWith('personalities/');
                        default:
                            return true;
                    }
                });
                console.log('After code version filter:', filteredNodes.length, 'nodes');
            }
            
            // Filter edges based on minimum connections and available nodes
            const nodeIds = new Set(filteredNodes.map(node => node.id));
            console.log('Available node IDs:', nodeIds.size);
            
            // Debug: Check how many edges meet the weight requirement
            const edgesByWeight = networkData.edges.filter(edge => edge.weight >= minConnections);
            console.log('Edges with weight >=', minConnections + ':', edgesByWeight.length);
            
            const filteredEdges = networkData.edges.filter(edge => {
                const weightOK = edge.weight >= minConnections;
                const sourceOK = nodeIds.has(edge.source);
                const targetOK = nodeIds.has(edge.target);
                
                if (!weightOK || !sourceOK || !targetOK) {
                    // Debug failed edges occasionally
                    if (Math.random() < 0.01) { // Log 1% of failures for debugging
                        console.log('Edge filtered out:', {
                            source: edge.source,
                            target: edge.target, 
                            weight: edge.weight,
                            weightOK,
                            sourceOK,
                            targetOK
                        });
                    }
                }
                
                return weightOK && sourceOK && targetOK;
            });
            
            console.log('After connection filter:', filteredEdges.length, 'edges');
            
            // Remove isolated nodes
            const connectedNodeIds = new Set();
            filteredEdges.forEach(edge => {
                connectedNodeIds.add(edge.source);
                connectedNodeIds.add(edge.target);
            });
            
            filteredNodes = filteredNodes.filter(node => connectedNodeIds.has(node.id));
            
            console.log('Final result:', filteredNodes.length, 'nodes,', filteredEdges.length, 'edges');
            console.log('=== FILTER DATA END ===');
            
            // If no nodes remain, show a message but don't break the visualization
            if (filteredNodes.length === 0) {
                console.log('No nodes match the current filter criteria');
            }
            
            filteredData = {
                nodes: filteredNodes.map(node => ({...node})), // Deep copy nodes
                edges: filteredEdges.map(edge => ({...edge}))  // Deep copy edges
            };
            
            updateStats();
            updateVisualization();
        }
        
        // Update statistics display
        function updateStats() {
            if (!filteredData) return;
            
            const pfiles = filteredData.nodes.filter(n => n.full_path.startsWith('personalities/')).length;
            document.getElementById('stat-files').textContent = filteredData.nodes.length;
            document.getElementById('stat-files-split').textContent = `(${pfiles} p-files, ${filteredData.nodes.length - pfiles} other)`;
            document.getElementById('stat-connections').textContent = filteredData.edges.length;
            document.getElementById('stat-commits').textContent = networkData.statistics.total_commits;
        }
        
        // Update network visualization
        function updateVisualization() {
            if (!filteredData) {
                console.log('No filtered data for visualization');
                return;
            }
            
            // Calculate dimensions first
            const sidebarActive = document.getElementById('sidebar').classList.contains('active');
            const width = sidebarActive ? window.innerWidth - 400 : window.innerWidth;
            const height = window.innerHeight;
            
            console.log('Updating visualization with', filteredData.nodes.length, 'nodes and', filteredData.edges.length, 'edges');
            
            if (filteredData.nodes.length === 0) {
                console.log('No nodes to display - clearing visualization');
                svg.select('.links').selectAll('*').remove();
                svg.select('.nodes').selectAll('*').remove();
                svg.select('.labels').selectAll('*').remove();
                
                // Add text message when no data
                svg.select('g').selectAll('text.no-data').remove();
                svg.select('g').append('text')
                    .attr('class', 'no-data')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('text-anchor', 'middle')
                    
                    .attr('font-size', '18px')
                    .text('No connections match the current filter criteria');
                
                return;
            } else {
                // Remove no-data message if it exists
                svg.select('g').selectAll('text.no-data').remove();
            }
            
            console.log('Visualization dimensions:', width, 'x', height);
            
            // Clear previous visualization
            svg.select('.links').selectAll('*').remove();
            svg.select('.nodes').selectAll('*').remove();
            svg.select('.labels').selectAll('*').remove();
            
            // Stop previous simulation
            if (simulation) simulation.stop();
            
            // Create new simulation
            const layoutType = document.getElementById('layout-select').value;
            simulation = createSimulation(layoutType, width, height);
            
            // Create links
            links = svg.select('.links')
                .selectAll('line')
                .data(filteredData.edges)
                .enter()
                .append('line')
                .attr('class', 'link')
                .style('stroke-width', d => 0.5 + Math.sqrt(d.weight) * 0.35)
                .on('mouseover', function(event, d) {
                    d3.select(this).classed('highlighted', true);
                    showLinkTooltip(event, d);
                })
                .on('mouseout', function() {
                    d3.select(this).classed('highlighted', false);
                    hideTooltip();
                });
            
            // Create nodes
            nodes = svg.select('.nodes')
                .selectAll('circle')
                .data(filteredData.nodes)
                .enter()
                .append('circle')
                .attr('class', 'node')
                .attr('r', d => Math.sqrt(d.commit_count) + 3)
                .style('fill', d => nodeColor(d))
                .on('click', function(event, d) {
                    selectNode(d);
                    showFileDetails(d);
                })
                .on('mouseover', function(event, d) {
                    d3.select(this).classed('selected', true);
                    highlightConnections(d);
                })
                .on('mouseout', function() {
                    d3.select(this).classed('selected', false);
                    unhighlightConnections();
                });
            
            // Create labels
            labels = svg.select('.labels')
                .selectAll('text')
                .data(filteredData.nodes.filter(d => d.commit_count > 5)) // Only show labels for active files
                .enter()
                .append('text')
                .attr('class', 'node-label')
                .text(d => d.label)
                .style('font-size', d => Math.min(12, Math.sqrt(d.commit_count) + 6) + 'px');
            
            // Add drag behavior
            nodes.call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));
            
            // Update positions on tick
            simulation.on('tick', () => {
                if (links) {
                    links
                        .attr('x1', d => d.source.x)
                        .attr('y1', d => d.source.y)
                        .attr('x2', d => d.target.x)
                        .attr('y2', d => d.target.y);
                }
                
                if (nodes) {
                    nodes
                        .attr('cx', d => d.x)
                        .attr('cy', d => d.y);
                }
                
                if (labels) {
                    labels
                        .attr('x', d => d.x)
                        .attr('y', d => d.y - Math.sqrt(d.commit_count) - 7);
                }
            });
        }
        
        // Create simulation based on layout type
        function createSimulation(layoutType, width, height) {
            let sim;
            
            switch (layoutType) {
                case 'force':
                    sim = d3.forceSimulation(filteredData.nodes)
                        .force('link', d3.forceLink(filteredData.edges).id(d => d.id).distance(50))
                        .force('charge', d3.forceManyBody().strength(-200))
                        .force('center', d3.forceCenter(width / 2, height / 2))
                        .force('collision', d3.forceCollide().radius(d => Math.sqrt(d.commit_count) + 5));
                    break;
                    
                case 'circular':
                    // Position nodes in a circle
                    const radius = Math.min(width, height) * 0.3;
                    filteredData.nodes.forEach((node, i) => {
                        const angle = (i / filteredData.nodes.length) * 2 * Math.PI;
                        node.fx = width / 2 + radius * Math.cos(angle);
                        node.fy = height / 2 + radius * Math.sin(angle);
                    });
                    
                    sim = d3.forceSimulation(filteredData.nodes)
                        .force('link', d3.forceLink(filteredData.edges).id(d => d.id).distance(30));
                    break;
                    
                case 'hierarchical':
                    // Simple hierarchical layout by category
                    const categories = [...new Set(filteredData.nodes.map(d => d.category))];
                    const categoryY = {};
                    categories.forEach((cat, i) => {
                        categoryY[cat] = (height / (categories.length + 1)) * (i + 1);
                    });
                    
                    filteredData.nodes.forEach((node, i) => {
                        node.fx = (width / (filteredData.nodes.length + 1)) * (i + 1);
                        node.fy = categoryY[node.category];
                    });
                    
                    sim = d3.forceSimulation(filteredData.nodes)
                        .force('link', d3.forceLink(filteredData.edges).id(d => d.id).distance(40))
                        .force('collision', d3.forceCollide().radius(d => Math.sqrt(d.commit_count) + 5));
                    break;
            }
            
            return sim;
        }
        
        // Highlight connections when hovering over a node
        function highlightConnections(node) {
            const connectedEdges = filteredData.edges.filter(edge => 
                edge.source === node || edge.target === node ||
                edge.source.id === node.id || edge.target.id === node.id
            );
            
            links.classed('highlighted', d => 
                connectedEdges.includes(d)
            );
        }
        
        function unhighlightConnections() {
            links.classed('highlighted', false);
        }
        
        // Select a node and show its details
        function selectNode(node) {
            nodes.classed('selected', false);
            nodes.filter(d => d.id === node.id).classed('selected', true);
            selectedNode = node;
        }
        
        // Show detailed information about a file
        function showFileDetails(node) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');
            
            const group = groupOf(node);
            
            // Find connected files
            const connections = filteredData.edges
                .filter(edge => edge.source.id === node.id || edge.target.id === node.id)
                .map(edge => {
                    const other = edge.source.id === node.id ? edge.target : edge.source;
                    return { file: other, weight: edge.weight };
                })
                .sort((a, b) => b.weight - a.weight);
            
            let html = `
                <div class="file-info">
                    <div class="file-path">${node.full_path}</div>
                    <span class="file-category"><span class="swatch" style="background:${css(group.token)}"></span>${group.label} · 
                        ${node.category}
                    </span>
                    <div class="file-commits">${node.commit_count} commits</div>
                </div>
                
                <h3>Connected Files (${connections.length})</h3>
            `;
            
            connections.slice(0, 10).forEach(conn => {
                html += `
                    <div class="conn-item">
                        <div><span class="swatch" style="background:${nodeColor(conn.file)}"></span>${conn.file.label}</div>
                        <div class="muted">${conn.weight} shared commits</div>
                    </div>
                `;
            });
            
            html += `<h3>Recent Commits</h3>`;
            
            node.commits.slice(0, 10).forEach(commit => {
                html += `
                    <div class="commit-item">
                        <div class="commit-hash">${commit.hash}</div>
                        <div class="commit-date">${commit.date} • <span class="commit-author">${commit.author}</span></div>
                        <div class="commit-subject">${commit.subject}</div>
                        <div class="commit-files">${commit.files_count} files changed</div>
                    </div>
                `;
            });
            
            content.innerHTML = html;
            sidebar.classList.add('active');
            document.getElementById('main-view').classList.add('sidebar-open');
        }
        
        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // Tooltip functions
        function showLinkTooltip(event, link) {
            // Simple tooltip - could be enhanced
            console.log(`Connection: ${link.source.label} ↔ ${link.target.label} (${link.weight} commits)`);
        }
        
        function hideTooltip() {
            // Hide tooltip
        }
        
        // Update legend
        function updateLegend() {
            const legendItems = document.getElementById('legend-items');
            legendItems.innerHTML = '';
            
            const present = new Set(networkData.nodes.map(n => groupOf(n).key));
            groups.filter(g => present.has(g.key)).forEach(g => {
                legendItems.innerHTML += `
                    <div class="legend-item">
                        <span class="swatch" style="background:${css(g.token)}"></span>
                        <span>${g.label}</span>
                    </div>
                `;
            });
        }
        
        // Event listeners
        function setupEventListeners() {
            document.getElementById('layout-select').addEventListener('change', updateVisualization);
            document.getElementById('filter-category').addEventListener('change', filterData);
            document.getElementById('code-version-filter').addEventListener('change', filterData);
            document.getElementById('min-connections').addEventListener('input', function() {
                document.getElementById('min-connections-value').textContent = this.value;
                console.log('Co-change threshold changed to:', this.value);
                filterData();
            });
            
            document.getElementById('close-sidebar').addEventListener('click', function() {
                document.getElementById('sidebar').classList.remove('active');
                document.getElementById('main-view').classList.remove('sidebar-open');
                if (selectedNode) {
                    nodes.classed('selected', false);
                    selectedNode = null;
                }
            });
        }
        
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            svg.attr('width', width).attr('height', height);
            if (simulation) {
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.restart();
            }
        });
        
        // Load data and initialize
        d3.json('output/file_networks.json').then(function(data) {
            networkData = data;
            document.getElementById('min-connections').max = d3.max(data.edges, e => e.weight);
            
            console.log('Raw data loaded:', data.nodes.length, 'nodes,', data.edges.length, 'edges');
            console.log('Edge weight range:', Math.min(...data.edges.map(e => e.weight)), 'to', Math.max(...data.edges.map(e => e.weight)));
            
            // Debug: show some sample weights
            const sampleWeights = data.edges.slice(0, 10).map(e => e.weight);
            console.log('Sample edge weights:', sampleWeights);
            
            // Debug: count edges by weight
            const weightCounts = {};
            data.edges.forEach(e => {
                weightCounts[e.weight] = (weightCounts[e.weight] || 0) + 1;
            });
            console.log('Weight distribution:', weightCounts);
            
            // Populate category filter
            const categorySelect = document.getElementById('filter-category');
            data.statistics.categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
            
            // Initialize visualization
            initVisualization();
            updateLegend();
            setupEventListeners();
            
            console.log('About to call initial filterData...');
            filterData();
            
            console.log('File network visualization loaded');
            console.log(`${data.nodes.length} files, ${data.edges.length} connections`);
        }).catch(error => {
            console.error('Error loading file network data:', error);
        });
    </script>
</body>
</html>
