<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Work Type Timeline - SCbounce Evolution</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="timerange.js"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        body { overflow: hidden; }

        #container { display: flex; flex-direction: column; height: 100vh; }

        .page-header { flex-shrink: 0; padding-bottom: 14px; }

        #timeline-controls {
            display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
            padding: 12px 32px; border-bottom: 1px solid var(--hair); flex-shrink: 0;
        }
        #time-range { flex: 1; min-width: 300px; }

        #filter-controls {
            display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap;
            padding: 12px 32px; border-bottom: 1px solid var(--ink); flex-shrink: 0;
        }
        #filter-controls h4 { margin: 0 6px 0 0; }
        #category-filters { display: flex; gap: 8px; flex-wrap: wrap; }

        .category-filter {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 3px 12px; border: 1px solid var(--ink); border-radius: 999px;
            cursor: pointer; user-select: none; font-size: 13px;
        }
        .category-filter:hover { background: var(--paper-2); }
        .category-filter.inactive { opacity: .35; }
        .category-filter.inactive label { text-decoration: line-through; }
        .category-filter input { display: none; }
        .category-filter label { cursor: pointer; margin: 0; color: var(--ink); }

        #visualization-area { flex: 1; display: flex; min-height: 0; }
        #chart-column { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #view-controls { display: flex; gap: 8px; padding: 14px 32px 0; flex-shrink: 0; }
        #chart-container { flex: 1; min-height: 0; }

        #side-column {
            flex: 0 0 260px; border-left: 1px solid var(--ink);
            padding: 18px 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 22px;
        }
        #side-column h4 { margin: 0 0 10px; }

        .stat-item { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0; font-size: 13px; }
        .stat-category { color: var(--ink-2); }
        .stat-item .stat-value { font-size: 13px; }
        .stat-item.total { border-bottom: 1px solid var(--hair); padding-bottom: 8px; margin-bottom: 10px; }
        .stat-item.total .stat-value { font-size: 18px; }

        .legend-item { display: flex; align-items: center; margin: 6px 0; font-size: 13px; color: var(--ink); }
        .legend-item .note { color: var(--ink-3); font-size: 11px; margin-left: 6px; }

        .chart-tooltip {
            position: absolute; pointer-events: none; z-index: 20;
            background: var(--paper); color: var(--ink); border: 1px solid var(--ink);
            padding: 8px 11px; font-size: 12px; box-shadow: 4px 4px 0 var(--hair);
        }

        .chart-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; fill: var(--ink-3); font-weight: 500; }
        .bubble text { fill: var(--ink); font-weight: 500; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
    </style>
</head>
<body>
    <div id="container">
        <header class="page-header">
            <h1>Work Type Timeline</h1>
            <p>Commits per month, each split across the kinds of work its files belong to.</p>
        </header>

        <div id="timeline-controls">
            <div id="time-range"></div>
        </div>

        <div id="filter-controls">
            <h4>Categories</h4>
            <div id="category-filters"></div>
        </div>

        <div id="visualization-area">
            <div id="chart-column">
                <div id="view-controls">
                    <button class="view-button active" data-view="stacked">Stacked Area</button>
                    <button class="view-button" data-view="bubbles">Category Bubbles</button>
                    <button class="view-button" data-view="stream">Stream Graph</button>
                </div>
                <div id="chart-container"></div>
            </div>

            <div id="side-column">
                <div id="stats-panel">
                    <h4>Selected Period</h4>
                    <div id="stats-content"></div>
                </div>

                <div class="legend">
                    <h4>Work Categories</h4>
                    <div id="legend-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let timelineData = [];
        let selectedRange = null;
        let activeCategories = new Set();
        let currentView = 'stacked';
        let previousView = 'stacked'; // Track previous view
        let bubbleStore = new Map(); // Persistent bubble store
        let bubbleSimulation = null; // Store simulation instance
        
        const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        const categoryColors = {
            'Implementation': css('--c-2'),
            'Personalities': css('--c-1'),
            'Visual': css('--c-3'),
            'Experimentation': css('--c-other'),
            'Analysis': css('--c-ink'),
            'Performance': css('--c-other'),
            'Infrastructure': css('--c-4'),
            'Other': css('--c-other')
        };
        const foldedIntoOther = ['Performance', 'Experimentation'];

        // Load and initialize
        async function loadData() {
            try {
                const response = await fetch('output/work_type_data.json');
                const data = await response.json();
                timelineData = data.timeline;
                
                setupControls();
                initializeFilters();
                updateVisualization();
                
                console.log('Data loaded:', data.summary);
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function monthStart(entry) {
            return d3.timeParse('%Y-%m')(entry.date);
        }

        function monthsInRange(extent = selectedRange) {
            if (!extent) return timelineData;
            const [d0, d1] = extent;
            return timelineData.filter(d => monthStart(d) < d1 && d3.timeMonth.offset(monthStart(d), 1) > d0);
        }

        const commitCount = d3.format(',.1~f');

        function aggregate(months) {
            const categories = {};
            months.forEach(d => Object.entries(d.categories).forEach(([category, data]) => {
                const sum = categories[category] || (categories[category] = {total: 0, subcategories: {}});
                sum.total += data.total;
                Object.entries(data.subcategories).forEach(([sub, n]) => {
                    sum.subcategories[sub] = (sum.subcategories[sub] || 0) + n;
                });
            }));
            return {categories, commits: d3.sum(months, d => d.commits)};
        }

        function setupControls() {
            if (timelineData.length > 0) {
                const dates = timelineData.flatMap(d => Array(d.commits).fill(monthStart(d)));
                const range = TimeRange(document.getElementById('time-range'), {
                    dates,
                    summary: extent => `${aggregate(monthsInRange(extent)).commits} commits`,
                    onChange: extent => {
                        selectedRange = extent;
                        updateVisualization();
                    },
                });
                selectedRange = range.extent();
            }

            // View control buttons
            document.querySelectorAll('.view-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    document.querySelectorAll('.view-button').forEach(b => b.classList.remove('active'));
                    button.classList.add('active');
                    currentView = button.dataset.view;
                    updateVisualization();
                });
            });
        }

        function initializeFilters() {
            const filtersContainer = document.getElementById('category-filters');
            const allCategories = Object.keys(categoryColors);
            
            // Initialize all categories as active
            allCategories.forEach(cat => activeCategories.add(cat));
            
            allCategories.forEach(category => {
                const filterDiv = document.createElement('div');
                filterDiv.className = 'category-filter active';

                const colorDot = document.createElement('span');
                colorDot.className = 'swatch';
                colorDot.style.backgroundColor = categoryColors[category];
                
                // Hidden checkbox for state tracking
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `filter-${category}`;
                checkbox.checked = true;
                
                const label = document.createElement('label');
                label.htmlFor = `filter-${category}`;
                label.textContent = category;
                
                filterDiv.appendChild(colorDot);
                filterDiv.appendChild(checkbox);
                filterDiv.appendChild(label);
                
                filterDiv.addEventListener('click', (e) => {
                    e.preventDefault();
                    checkbox.checked = !checkbox.checked;
                    
                    if (checkbox.checked) {
                        filterDiv.classList.remove('inactive');
                        filterDiv.classList.add('active');
                        activeCategories.add(category);
                    } else {
                        filterDiv.classList.remove('active');
                        filterDiv.classList.add('inactive');
                        activeCategories.delete(category);
                    }
                    
                    updateVisualization();
                });
                
                filtersContainer.appendChild(filterDiv);
            });
        }

        function updateVisualization() {
            const months = monthsInRange();
            if (!months.length) return;
            
            const currentData = aggregate(months);
            updateStats(currentData);
            updateLegend();
            
            // Handle different visualization types
            switch(currentView) {
                case 'stacked':
                    // Clear for stacked area (it recreates)
                    d3.select("#chart-container").select("svg").remove();
                    createStackedArea();
                    break;
                case 'bubbles':
                    // Clear SVG only when switching TO bubble view from another view
                    if (previousView !== 'bubbles') {
                        d3.select("#chart-container").select("svg").remove();
                        bubbleStore.clear(); // Reset bubble store when switching to bubbles
                        bubbleSimulation = null; // Reset simulation
                    }
                    createBubbleChart(currentData);
                    break;
                case 'stream':
                    // Clear for stream graph (it recreates)
                    d3.select("#chart-container").select("svg").remove();
                    createStreamGraph();
                    break;
            }
            
            // Update previous view tracking
            previousView = currentView;
        }

        function updateStats(currentData) {
            const statsContent = document.getElementById('stats-content');
            statsContent.innerHTML = '';
            
            // Calculate total commits for current period
            let totalCommits = 0;
            Object.entries(currentData.categories).forEach(([category, data]) => {
                if (activeCategories.has(category)) {
                    totalCommits += data.total;
                }
            });
            
            // Add total
            const totalDiv = document.createElement('div');
            totalDiv.className = 'stat-item total';
            totalDiv.innerHTML = `
                <span class="stat-category">Total Commits</span>
                <span class="stat-value">${commitCount(totalCommits)}</span>
            `;
            statsContent.appendChild(totalDiv);
            
            // Add category breakdown
            Object.entries(currentData.categories)
                .filter(([category]) => activeCategories.has(category))
                .sort((a, b) => b[1].total - a[1].total)
                .forEach(([category, data]) => {
                    if (data.total > 0) {
                        const div = document.createElement('div');
                        div.className = 'stat-item';
                        div.innerHTML = `
                            <span class="stat-category"><span class="swatch" style="background:${categoryColors[category]}"></span>${category}</span>
                            <span class="stat-value">${commitCount(data.total)}</span>
                        `;
                        statsContent.appendChild(div);
                    }
                });
        }

        function updateLegend() {
            const legendContent = document.getElementById('legend-content');
            legendContent.innerHTML = '';
            
            const folded = foldedIntoOther.filter(c => activeCategories.has(c));
            Object.keys(categoryColors)
                .filter(category => activeCategories.has(category) || (category === 'Other' && folded.length))
                .filter(category => !foldedIntoOther.includes(category))
                .forEach(category => {
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    const note = category === 'Other' && folded.length ? `<span class="note">incl. ${folded.join(', ')}</span>` : '';
                    item.innerHTML = `<span class="swatch" style="background:${categoryColors[category]}"></span><span>${category}</span>${note}`;
                    legendContent.appendChild(item);
                });
        }

        function createBubbleChart(currentData) {
            const container = d3.select("#chart-container");
            const containerRect = container.node().getBoundingClientRect();
            const width = containerRect.width;
            const height = containerRect.height;
            const margin = {top: 40, right: 40, bottom: 40, left: 40};
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;
            
            // Get or create SVG and chart group - only once
            let svg = container.select("svg");
            if (svg.empty()) {
                svg = container.append("svg")
                    .attr("width", width)
                    .attr("height", height);
                
                // Create chart group
                svg.append("g")
                    .attr("class", "bubble-chart-group")
                    .attr("transform", `translate(${margin.left},${margin.top})`);
                
                // Create title
                svg.append("text")
                    .attr("class", "bubble-title chart-title")
                    .attr("x", 32)
                    .attr("y", 25);
                
                // Create tooltip only once
                if (d3.select(".bubble-tooltip").empty()) {
                    d3.select("body").append("div")
                        .attr("class", "bubble-tooltip chart-tooltip")
                        .style("opacity", 0);
                }
            }
            
            const g = svg.select(".bubble-chart-group");
            const tooltip = d3.select(".bubble-tooltip");
            
            // Ensure all categories exist in the bubble store (create if needed)
            const allCategories = Object.keys(categoryColors);
            allCategories.forEach(category => {
                if (!bubbleStore.has(category)) {
                    const bubbleData = {
                        category,
                        total: 0,
                        subcategories: {},
                        x: chartWidth / 2,
                        y: chartHeight / 2,
                        vx: 0,
                        vy: 0
                    };
                    bubbleStore.set(category, bubbleData);
                }
            });
            
            // Update bubble data for current frame
            allCategories.forEach(category => {
                const bubbleData = bubbleStore.get(category);
                const categoryData = currentData.categories[category];
                
                if (activeCategories.has(category) && categoryData && categoryData.total > 0) {
                    // Category should be visible
                    bubbleData.total = categoryData.total;
                    bubbleData.subcategories = categoryData.subcategories;
                } else {
                    // Category should be hidden (size 0)
                    bubbleData.total = 0;
                    bubbleData.subcategories = {};
                }
            });
            
            // Use all bubbles from store (they all exist now)
            const allBubbleData = Array.from(bubbleStore.values());
            
            // Scale for bubble size
            const visibleTotals = allBubbleData.map(d => d.total).filter(t => t > 0);
            const maxTotal = Math.max(...visibleTotals, 1);
            const sizeScale = d3.scaleSqrt()
                .domain([0, maxTotal])
                .range([0, Math.min(chartWidth, chartHeight) / 8]);
            
            // Data join with ALL categories (persistent)
            const bubbles = g.selectAll(".bubble")
                .data(allBubbleData, d => d.category);
            
            // ENTER: Only happens once per category (first time seeing it)
            const enteringBubbles = bubbles.enter()
                .append("g")
                .attr("class", "bubble")
                .attr("transform", d => `translate(${d.x},${d.y})`);
            
            // Add circle to new bubbles (starts at 0)
            enteringBubbles.append("circle")
                .attr("r", 0)
                .attr("fill", d => categoryColors[d.category])
                .attr("fill-opacity", 0.9)
                .attr("stroke", css('--paper'))
                .attr("stroke-width", 2)
                .on("mouseover", function(event, d) {
                    if (d.total > 0) {
                        tooltip.transition().duration(200).style("opacity", .9);
                        let tooltipContent = `<strong>${d.category}</strong><br/>Total: ${commitCount(d.total)} commits<br/>`;
                        Object.entries(d.subcategories).forEach(([sub, count]) => {
                            if (count > 0) tooltipContent += `${sub}: ${commitCount(count)}<br/>`;
                        });
                        tooltip.html(tooltipContent)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    }
                })
                .on("mouseout", function() {
                    tooltip.transition().duration(500).style("opacity", 0);
                });
            
            // Add text to new bubbles (starts invisible)
            enteringBubbles.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", ".35em")
                .style("pointer-events", "none")
                .style("font-size", "0px")
                .text(d => d.category);
            
            // UPDATE: All bubbles animate to their new size (0 or actual size)
            const allBubbles = bubbles.merge(enteringBubbles);
            
            // Animate circle size based on total (0 if hidden, actual size if visible)
            allBubbles.select("circle")
                .transition()
                .duration(600)
                .ease(d3.easeElasticOut.amplitude(1).period(0.5))
                .attr("r", d => sizeScale(d.total));
            
            // Animate text size (0 if hidden, calculated size if visible)
            allBubbles.select("text")
                .transition()
                .duration(600)
                .ease(d3.easeElasticOut.amplitude(1).period(0.5))
                .style("font-size", d => sizeScale(d.total) > 24 ? Math.max(10, sizeScale(d.total) / 4) + "px" : "0px");
            
            // Create or update simulation with all bubbles
            if (bubbleSimulation) {
                bubbleSimulation.nodes(allBubbleData);
                bubbleSimulation.force("collide", d3.forceCollide().radius(d => Math.max(sizeScale(d.total) + 5, 2)).strength(0.8));
                bubbleSimulation.alpha(0.3).restart();
            } else {
                bubbleSimulation = d3.forceSimulation(allBubbleData)
                    .force("x", d3.forceX(chartWidth / 2).strength(0.05))
                    .force("y", d3.forceY(chartHeight / 2).strength(0.05))
                    .force("collide", d3.forceCollide().radius(d => Math.max(sizeScale(d.total) + 5, 2)).strength(0.8))
                    .alphaDecay(0.02)
                    .velocityDecay(0.3);
            }
            
            // Update positions on simulation tick
            bubbleSimulation.on("tick", () => {
                allBubbles.attr("transform", d => `translate(${d.x},${d.y})`);
            });
            
            // Update title
            svg.select(".bubble-title")
                .text('Work categories in the selected period');
        }

        function createStackedArea() {
            const container = d3.select("#chart-container");
            const containerRect = container.node().getBoundingClientRect();
            const width = containerRect.width;
            const height = containerRect.height;
            const margin = {top: 40, right: 60, bottom: 60, left: 80};
            
            const svg = container.append("svg")
                .attr("width", width)
                .attr("height", height);
                
            const g = svg.append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);
            
            // Prepare data for stacked area
            const stackData = monthsInRange().map(d => {
                const row = {date: d.date};
                Object.keys(categoryColors).forEach(category => {
                    row[category] = activeCategories.has(category) ? (d.categories[category]?.total || 0) : 0;
                });
                return row;
            });
            
            // Set up scales
            const xScale = d3.scalePoint()
                .domain(stackData.map(d => d.date))
                .range([0, width - margin.left - margin.right]);
            
            const yScale = d3.scaleLinear()
                .domain([0, d3.max(stackData, d => {
                    return d3.sum(Object.keys(categoryColors), cat => d[cat] || 0);
                })])
                .range([height - margin.top - margin.bottom, 0]);
            
            // Create stack
            const stack = d3.stack()
                .keys(Array.from(activeCategories))
                .order(d3.stackOrderNone)
                .offset(d3.stackOffsetNone);
                
            const stackedData = stack(stackData);
            
            // Create area generator
            const area = d3.area()
                .x(d => xScale(d.data.date))
                .y0(d => yScale(d[0]))
                .y1(d => yScale(d[1]))
                .curve(d3.curveBasis);
            
            // Draw areas
            g.selectAll(".area")
                .data(stackedData)
                .enter().append("path")
                .attr("class", "area")
                .attr("d", area)
                .attr("fill", d => categoryColors[d.key])
                .attr("fill-opacity", 0.85)
                .attr("stroke", css('--paper'))
                .attr("stroke-width", 1);
            
            // Add axes
            g.append("g")
                .attr("transform", `translate(0,${height - margin.top - margin.bottom})`)
                .attr("class", "axis")
                .call(d3.axisBottom(xScale).tickValues(xScale.domain().filter((d, i) => i % 3 === 0)));

            g.append("g")
                .attr("class", "axis")
                .call(d3.axisLeft(yScale).ticks(6));
            
            // Add axis labels
            g.append("text")
                .attr("transform", "rotate(-90)")
                .attr("y", 0 - margin.left)
                .attr("x", 0 - (height - margin.top - margin.bottom) / 2)
                .attr("dy", "1em")
                .style("text-anchor", "middle")
                .style("fill", css('--ink-3'))
                .style("font-size", "12px")
                .text("Commits");
            
            // Add title
            svg.append("text")
                .attr("class", "chart-title")
                .attr("x", margin.left)
                .attr("y", 25)
                .text("Commits per month, stacked by work type");
        }

        function createStreamGraph() {
            const container = d3.select("#chart-container");
            const containerRect = container.node().getBoundingClientRect();
            const width = containerRect.width;
            const height = containerRect.height;
            const margin = {top: 40, right: 60, bottom: 60, left: 80};
            
            const svg = container.append("svg")
                .attr("width", width)
                .attr("height", height);
                
            const g = svg.append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);
            
            // Prepare data for stream graph
            const streamData = monthsInRange().map(d => {
                const row = {date: d.date};
                Object.keys(categoryColors).forEach(category => {
                    row[category] = activeCategories.has(category) ? (d.categories[category]?.total || 0) : 0;
                });
                return row;
            });
            
            // Set up scales
            const xScale = d3.scalePoint()
                .domain(streamData.map(d => d.date))
                .range([0, width - margin.left - margin.right]);
            
            // Create stack with stream offset
            const stack = d3.stack()
                .keys(Array.from(activeCategories))
                .order(d3.stackOrderInsideOut)
                .offset(d3.stackOffsetWiggle);
                
            const stackedData = stack(streamData);
            
            // Find the extent for y scale
            const yExtent = d3.extent(stackedData.flat().flat());
            const yScale = d3.scaleLinear()
                .domain(yExtent)
                .range([height - margin.top - margin.bottom, 0]);
            
            // Create area generator
            const area = d3.area()
                .x(d => xScale(d.data.date))
                .y0(d => yScale(d[0]))
                .y1(d => yScale(d[1]))
                .curve(d3.curveBasis);
            
            // Draw streams
            g.selectAll(".stream")
                .data(stackedData)
                .enter().append("path")
                .attr("class", "stream")
                .attr("d", area)
                .attr("fill", d => categoryColors[d.key])
                .attr("fill-opacity", 0.85)
                .attr("stroke", css('--paper'))
                .attr("stroke-width", 1);
            
            // Add x-axis
            g.append("g")
                .attr("class", "axis")
                .attr("transform", `translate(0,${height - margin.top - margin.bottom})`)
                .call(d3.axisBottom(xScale).tickValues(xScale.domain().filter((d, i) => i % 3 === 0)));
            
            // Add title
            svg.append("text")
                .attr("class", "chart-title")
                .attr("x", margin.left)
                .attr("y", 25)
                .text("Work flow, centred stream");
        }

        // Initialize the application
        loadData();
    </script>
</body>
</html>
