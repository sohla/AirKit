# jackd, as scsynth starts it from ~/.jackdrc. -P40 keeps audio below the
# Wi-Fi interrupt (FIFO 50); see docs/requirements.md item 12-13.
jack_card: S3
jack_priority: 40
jack_command: /usr/bin/jackd -R -P{{ jack_priority }} -dalsa -dhw:{{ jack_card }} -r44100 -p256 -n3

pipewire_user_units:
  - pipewire.socket
  - pipewire.service
  - pipewire-pulse.socket
  - pipewire-pulse.service
  - wireplumber.service
